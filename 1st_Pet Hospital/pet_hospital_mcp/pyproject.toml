[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "Stateless MCP (2026-07-28) server that exposes the Go pet hospital REST API (GET /api/v1/pets) to AI agents via the list_pets tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]